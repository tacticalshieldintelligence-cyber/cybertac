<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Inteligência | Cybertac</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="fundo-login">

    <div class="caixa-login">
        <!-- Ícone tático -->
        <div class="icone-seguranca"></div>
        <h2>Acesso Restrito</h2>
        
        <p style="margin-bottom: 20px;">Insira sua credencial de acesso para entrar no Centro de Comando tático.</p>
        
        <!-- Formulário de Autenticação -->
        <form id="form-login">
            <input type="password" id="senha-cliente" placeholder="Chave de Acesso" required style="width: 100%; padding: 15px; margin-bottom: 20px; background-color: rgba(0,0,0,0.5); color: #fff; border: 1px solid #00d2ff; text-align: center; font-size: 1.2rem; box-sizing: border-box;">
            
            <button type="submit" class="btn-tatico" style="width: 100%; display: block; border: none; cursor: pointer; padding: 15px; font-weight: bold; letter-spacing: 1px; box-sizing: border-box;">
                INICIAR AUTENTICAÇÃO
            </button>
        </form>

        <a href="index.html" class="link-voltar" style="display: block; margin-top: 25px; text-align: center;">← Retornar à Base Principal</a>
    </div>

    <!-- Ligação com o motor de autenticação -->
    <script src="auth.js"></script>
</body>
</html>
